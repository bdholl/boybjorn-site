<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boy Bjorn</title>
<meta name="description" content="Folk songs from Milwaukee. New song The River, out December 4.">
<meta property="og:title" content="Boy Bjorn">
<meta property="og:description" content="Folk songs from Milwaukee. The River, out December 4.">
<meta property="og:image" content="https://boybjorn.com/cover.jpg">
<meta property="og:url" content="https://boybjorn.com">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="cover.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f2eee5; --ink:#1f1d1a; --soft:#6b665d; --line:#d9d3c6;
    --river:#8fcfc8; --river-ink:#123d3a; --card:#fbf9f4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;line-height:1.45;min-height:100vh;display:flex;justify-content:center}
  main{width:100%;max-width:440px;padding:40px 20px 56px}
  header{text-align:center;margin-bottom:28px}
  .avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 14px;background:var(--line)}
  h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:34px;letter-spacing:-.01em;line-height:1.05}
  .tag{color:var(--soft);font-size:15px;margin-top:6px}

  .feature{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:22px}
  .cover{width:100%;aspect-ratio:1/1;border-radius:10px;object-fit:cover;display:block;background:var(--river)}
  .cover-fallback{width:100%;aspect-ratio:1/1;border-radius:10px;background:var(--river);display:none;align-items:center;justify-content:center;font-family:Fraunces,Georgia,serif;font-size:40px;color:var(--river-ink)}
  .meta{display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 12px}
  .meta h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:24px}
  .meta span{font-size:13px;color:var(--soft);text-transform:uppercase;letter-spacing:.08em}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px 18px;border-radius:12px;text-decoration:none;font-weight:600;font-size:16px;transition:transform .08s ease, opacity .15s}
  .btn:active{transform:scale(.985)}
  .primary{background:var(--ink);color:var(--paper)}
  .primary:hover{opacity:.9}

  .label{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--soft);margin:0 2px 10px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
  .chip{display:flex;align-items:center;gap:10px;padding:13px 14px;border:1px solid var(--line);background:var(--card);border-radius:12px;color:var(--ink);text-decoration:none;font-weight:500;font-size:15px}
  .chip:hover{border-color:var(--ink)}
  .chip svg{width:20px;height:20px;flex:none}

  .list{background:var(--river);color:var(--river-ink);border-radius:18px;padding:20px;margin-bottom:22px}
  .list h3{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:21px;margin-bottom:4px}
  .list p{font-size:14px;margin-bottom:14px;opacity:.85}
  .list .btn{background:var(--river-ink);color:#fff}

  footer{text-align:center}
  .social{display:flex;justify-content:center;gap:22px;margin:6px 0 18px}
  .social a{color:var(--ink);display:inline-flex}
  .social svg{width:24px;height:24px}
  .mail{font-size:14px;color:var(--soft)}
  .mail a{color:var(--ink)}
  .hidden{display:none!important}
</style>

<!-- Meta pixel: paste the Pixel ID from Events Manager into PIXEL_ID below. Leave empty to turn tracking off. -->
<script>
  window.BB = {
    PIXEL_ID: "514979485964352",
    RELEASE: "2026-12-04T00:00:00-06:00",
    LINKS: {
      presave:  "#",                                   // DistroKid HyperFollow link for The River
      river:    "#",                                   // Spotify link to The River (live on Dec 4)
      spotify:  "https://open.spotify.com/artist/2qfpz8vJJMRopufkA7RjOU",
      apple:    "https://music.apple.com/us/artist/boy-bjorn/1254162109",
      amazon:   "https://music.amazon.com/artists/B073SJ7P5S/boy-bjorn",
      bandcamp: "https://boybjorn.bandcamp.com",
      youtube:  "",                                    // add once the channel exists
      instagram:"https://www.instagram.com/boybjorn",
      tiktok:   "https://www.tiktok.com/@boy.bjorn",
      email:    "info@boybjorn.com"
    }
  };
  if (BB.PIXEL_ID) {
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', BB.PIXEL_ID); fbq('track', 'PageView');
  }
</script>
</head>
<body>
<main>
  <header>
    <img class="avatar" src="photo.jpg" alt="Boy Bjorn" onerror="this.style.visibility='hidden'">
    <h1>Boy Bjorn</h1>
    <p class="tag">Folk songs from Milwaukee.</p>
  </header>

  <section class="feature">
    <img class="cover" src="cover.jpg" alt="The River cover art" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
    <div class="cover-fallback">The River</div>
    <div class="meta">
      <h2>The River</h2>
      <span id="status">Out Dec 4</span>
    </div>
    <a id="main-btn" class="btn primary" data-track="presave" href="#">Pre-save on Spotify</a>
  </section>

  <p class="label">Listen</p>
  <div class="grid" id="listen">
    <a class="chip" data-key="spotify" data-track="spotify">
      <svg viewBox="0 0 24 24" fill="#1DB954"><path d="M12 0a12 12 0 1 0 0 24 12 12 0 0 0 0-24zm5.5 17.3a.75.75 0 0 1-1 .25c-2.8-1.7-6.3-2.1-10.5-1.1a.75.75 0 1 1-.33-1.46c4.6-1.05 8.5-.6 11.6 1.3.36.22.47.69.25 1zm1.47-3.27a.94.94 0 0 1-1.29.31c-3.2-1.97-8.08-2.54-11.87-1.39a.94.94 0 1 1-.54-1.8c4.33-1.31 9.71-.68 13.4 1.59.44.27.58.85.3 1.29zm.13-3.4C15.24 8.34 8.88 8.13 5.2 9.25a1.12 1.12 0 1 1-.65-2.15c4.22-1.28 11.24-1.03 15.67 1.6a1.12 1.12 0 1 1-1.14 1.93z"/></svg>Spotify</a>
    <a class="chip" data-key="apple" data-track="apple">
      <svg viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#FA2D48"/><path fill="#fff" d="M16.5 5.6v8.9a2.4 2.4 0 1 1-1.4-2.2V8.4l-5.4 1.2v6.3a2.4 2.4 0 1 1-1.4-2.2V7.1z"/></svg>Apple Music</a>
    <a class="chip" data-key="amazon" data-track="amazon">
      <svg viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#25D1DA"/><path fill="#0b2a3a" d="M5 15.2c3.9 2.3 9.6 2.4 14 0l.5.8c-4.6 2.8-10.6 2.6-15 0zm11.9-1.4 2.5-.3-.2 2.4-.7-.9z"/><text x="12" y="12" font-family="Inter,Arial" font-size="6.5" font-weight="700" text-anchor="middle" fill="#0b2a3a">music</text></svg>Amazon</a>
    <a class="chip" data-key="bandcamp" data-track="bandcamp">
      <svg viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#1DA0C3"/><path fill="#fff" d="M4.5 16.5 9 7.5h10.5L15 16.5z"/></svg>Bandcamp</a>
    <a class="chip" data-key="youtube" data-track="youtube">
      <svg viewBox="0 0 24 24"><rect y="4" width="24" height="16" rx="5" fill="#FF0000"/><path fill="#fff" d="M10 8.5v7l6-3.5z"/></svg>YouTube</a>
  </div>

  <section class="list">
    <h3>Hear new songs first</h3>
    <p>A short note when something new is out. No spam.</p>
    <a class="btn" id="list-btn" data-track="email-list" href="#">Join the list</a>
  </section>

  <footer>
    <div class="social">
      <a data-key="instagram" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></a>
      <a data-key="tiktok" aria-label="TikTok"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 2h-3.3v13.2a2.9 2.9 0 1 1-2.9-2.9c.3 0 .6 0 .9.1V9a6.3 6.3 0 1 0 5.3 6.2V8.4a7.6 7.6 0 0 0 4.4 1.4V6.5A4.4 4.4 0 0 1 16.6 2z"/></svg></a>
      <a data-key="youtube" aria-label="YouTube"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12a31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8zM9.7 15.1V8.9l5.8 3.1z"/></svg></a>
    </div>
    <p class="mail">Booking and hello: <a id="mail-link" href="#"></a></p>
  </footer>
</main>

<script>
(function(){
  var L = BB.LINKS, out = new Date() >= new Date(BB.RELEASE);
  // Main button: pre-save before release, listen after
  var main = document.getElementById('main-btn');
  if (out) {
    main.textContent = 'Listen to The River';
    main.href = (L.river && L.river !== '#') ? L.river : L.spotify;
    main.dataset.track = 'river';
    document.getElementById('status').textContent = 'Out now';
  } else {
    main.href = (L.presave && L.presave !== '#') ? L.presave : L.spotify;
  }
  // Fill links, hide any that are empty
  document.querySelectorAll('[data-key]').forEach(function(a){
    var url = L[a.dataset.key];
    if (!url) { a.classList.add('hidden'); return; }
    a.href = url; a.target = '_blank'; a.rel = 'noopener';
  });
  var mail = document.getElementById('mail-link');
  mail.href = 'mailto:' + L.email; mail.textContent = L.email;
  document.getElementById('list-btn').href = 'mailto:' + L.email + '?subject=' + encodeURIComponent('Add me to the Boy Bjorn list');
  // Meta pixel: count clicks to music services
  document.querySelectorAll('[data-track]').forEach(function(a){
    a.addEventListener('click', function(){
      if (window.fbq) {
        fbq('trackCustom', 'MusicClick', {service: a.dataset.track});
        if (['presave','river','spotify'].indexOf(a.dataset.track) > -1) fbq('trackCustom', 'SpotifyClick');
      }
    });
  });
})();
</script>
</body>
</html>
